name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: Tests & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  windows:
    name: Windows installer (NSIS)
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Toolchain versions
        run: node --version; npm --version; rustc --version; cargo --version
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: cargo-win-${{ hashFiles('apps/desktop/src-tauri/Cargo.toml') }}
          restore-keys: cargo-win-
      - run: npm ci
      - name: Build LifeMentor for Windows
        working-directory: apps/desktop
        shell: pwsh
        run: npx tauri build 2>&1 | Tee-Object -FilePath tauri-build.log; exit $LASTEXITCODE
      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-build-log
          path: apps/desktop/tauri-build.log
      - name: Commit build log to arena/ci-logs (on failure)
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path apps/desktop/tauri-build.log) {
            Copy-Item apps/desktop/tauri-build.log ci-failure.log
          } else {
            Set-Content -Path ci-failure.log -Value 'tauri-build.log not found'
          }
          "=== repo permissions for GITHUB_TOKEN ===" | Add-Content ci-failure.log
          gh api repos/$env:GITHUB_REPOSITORY --jq '.permissions' | Add-Content ci-failure.log
          git config user.email "github-actions@github.com"
          git config user.name "github-actions[bot]"
          git add ci-failure.log
          git commit -m "ci: windows build failure log"
          git push -f origin HEAD:arena/ci-logs || echo "PUSH TO arena/ci-logs FAILED (likely no contents:write)"
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: LifeMentor-Windows
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
