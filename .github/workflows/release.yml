name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: Tests & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  windows:
    name: Windows installer (NSIS)
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Toolchain versions
        run: node --version; npm --version; rustc --version; cargo --version
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: cargo-win-${{ hashFiles('apps/desktop/src-tauri/Cargo.toml') }}
          restore-keys: cargo-win-
      - run: npm ci
      - name: Build LifeMentor for Windows
        working-directory: apps/desktop
        shell: pwsh
        run: npx tauri build 2>&1 | Tee-Object -FilePath tauri-build.log; exit $LASTEXITCODE
      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-build-log
          path: apps/desktop/tauri-build.log
      - name: Report failure (issue + branch)
        if: failure()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          "=== REPORT STEP START ==="
          try {
            if (Test-Path apps/desktop/tauri-build.log) {
              Copy-Item apps/desktop/tauri-build.log ci-failure.txt -Force
              "copied tauri-build.log -> ci-failure.txt"
            } else {
              Set-Content -Path ci-failure.txt -Value 'tauri-build.log not found' -Encoding utf8
              "WARNING: tauri-build.log not found"
            }
          } catch { Add-Content ci-failure.txt "COPY FAILED: $_" }
          try {
            $perms = gh api repos/$env:GITHUB_REPOSITORY --jq '.permissions' 2>&1
            "repo permissions: $perms"
            Add-Content ci-failure.txt "=== repo permissions: $perms"
          } catch { Add-Content ci-failure.txt "gh api permissions failed: $_" }
          git config user.email "github-actions@github.com"
          git config user.name "github-actions[bot]"
          "=== trying ISSUE channel ==="
          try {
            $title = "CI: Windows build failure log ($(Get-Date -Format yyyyMMdd-HHmm))"
            gh issue create --title $title --body-file ci-failure.txt
            "ISSUE CREATED"
          } catch { "ISSUE CHANNEL FAILED: $_" }
          "=== trying BRANCH channel ==="
          try {
            git add -f ci-failure.txt
            git commit -m "ci: windows build failure log"
            git push -f origin HEAD:arena/ci-logs
            "BRANCH PUSHED"
          } catch { "BRANCH CHANNEL FAILED: $_" }
          "=== REPORT STEP END ==="

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: LifeMentor-Windows
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
