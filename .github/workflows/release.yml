name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: Tests & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  windows:
    name: Windows installer (NSIS)
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Toolchain versions
        run: node --version; npm --version; rustc --version; cargo --version
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: cargo-win-${{ hashFiles('apps/desktop/src-tauri/Cargo.toml') }}
          restore-keys: cargo-win-
      - run: npm ci
      - name: Build LifeMentor for Windows
        working-directory: apps/desktop
        shell: pwsh
        run: npx tauri build 2>&1 | Tee-Object -FilePath tauri-build.log; exit $LASTEXITCODE
      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-build-log
          path: apps/desktop/tauri-build.log
      - name: Report failure (issue + branch)
        if: failure()
        shell: pwsh
        run: pwsh -NoProfile -File scripts/ci-failure-report.ps1; exit 0

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: LifeMentor-Windows
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
