name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: Tests & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  windows:
    name: Windows installer (NSIS)
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Toolchain versions
        run: node --version; npm --version; rustc --version; cargo --version
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: cargo-win-${{ hashFiles('apps/desktop/src-tauri/Cargo.toml') }}
          restore-keys: cargo-win-
      - run: npm ci
      - name: Build LifeMentor for Windows
        working-directory: apps/desktop
        shell: pwsh
        run: npx tauri build 2>&1 | Tee-Object -FilePath tauri-build.log; exit $LASTEXITCODE
      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-build-log
          path: apps/desktop/tauri-build.log
      - name: Report failure (issue + branch)
        if: failure()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          "=== REPORT START ==="
          if (Test-Path apps/desktop/tauri-build.log) {
            Copy-Item apps/desktop/tauri-build.log ci-failure.txt -Force
            "log copied"
          } else {
            Set-Content -Path ci-failure.txt -Value 'tauri-build.log not found' -Encoding utf8
            "WARNING: tauri-build.log missing"
          }
          $perm = gh api repos/$env:GITHUB_REPOSITORY --jq '.permissions' 2>&1
          "permissions (exit $LASTEXITCODE): $perm"
          Add-Content ci-failure.txt "=== GITHUB_TOKEN permissions: $perm"
          git config user.email "github-actions@github.com"
          git config user.name "github-actions[bot]"
          "=== ISSUE channel ==="
          $ghIssue = gh issue create --title "CI: Windows build failure log" --body-file ci-failure.txt 2>&1
          "gh issue create (exit $LASTEXITCODE): $ghIssue"
          if ($LASTEXITCODE -ne 0) {
            "trying curl fallback"
            $logText = Get-Content ci-failure.txt -Raw
            $payload = @{ title = "CI: Windows build failure log"; body = $logText } | ConvertTo-Json -Depth 5
            $curlOut = curl.exe -s -X POST -H "Authorization: token $($env:GITHUB_TOKEN)" -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" -d $payload "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues" 2>&1
            "curl issue create (exit $LASTEXITCODE): $curlOut"
          }
          "=== BRANCH channel ==="
          git add -f ci-failure.txt
          $addExit = $LASTEXITCODE
          $commitOut = git commit -m "ci: windows build failure log" 2>&1
          $commitExit = $LASTEXITCODE
          $pushOut = git push -f origin HEAD:arena/ci-logs 2>&1
          $pushExit = $LASTEXITCODE
          "git add exit=$addExit; commit exit=$commitExit: $commitOut"
          "git push exit=$pushExit: $pushOut"
          "=== REPORT END ==="
          exit 0

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: LifeMentor-Windows
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
